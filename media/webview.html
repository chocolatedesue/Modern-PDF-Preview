<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src {{CSP_SOURCE}} https://*.vscode-cdn.net https://*.vscode-resource.vscode-cdn.net blob: data:; script-src {{CSP_SOURCE}} 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; style-src {{CSP_SOURCE}} 'unsafe-inline'; worker-src {{CSP_SOURCE}} blob: data: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src {{CSP_SOURCE}} https://*.vscode-cdn.net https://*.vscode-resource.vscode-cdn.net blob: data:; font-src {{CSP_SOURCE}} https://*.vscode-cdn.net https://*.vscode-resource.vscode-cdn.net data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light dark;
      background-color: var(--vscode-editor-background, Canvas);
      color: var(--vscode-foreground, CanvasText);
    }

    body.vscode-dark,
    body.vscode-high-contrast {
      color-scheme: dark;
      background-color: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-foreground, #cccccc);
    }

    body.vscode-light {
      color-scheme: light;
      background-color: var(--vscode-editor-background, #ffffff);
      color: var(--vscode-foreground, #333333);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--vscode-font-family, system-ui, -apple-system, sans-serif);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--vscode-editor-background, Canvas);
    }

    #viewer-host {
      width: 100%;
      height: 100%;
    }

    /* Fail-open guard for custom element upgrade (modern-web-guidance: custom-elements) */
    embedpdf-viewer:not(:defined) {
      visibility: hidden;
      opacity: 0;
      animation: epdf-defined-fallback 0.2s 2s forwards;
    }

    @keyframes epdf-defined-fallback {
      to {
        visibility: visible;
        opacity: 1;
      }
    }

    embedpdf-viewer {
      display: block;
      width: 100%;
      height: 100%;
    }

    .status-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: var(--vscode-editor-background, Canvas);
      color: var(--vscode-foreground, CanvasText);
      z-index: 10;
    }

    .status-overlay[hidden] {
      display: none;
    }

    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--vscode-descriptionForeground, currentColor);
      font-size: 13px;
    }

    /* Opt in to motion only under prefers-reduced-motion: no-preference (modern-web-guidance: motion) */
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.3));
      border-top-color: var(--vscode-focusBorder, #007acc);
    }

    @media (prefers-reduced-motion: no-preference) {
      .spinner {
        animation: epdf-spin 0.9s linear infinite;
      }
    }

    @keyframes epdf-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-card {
      max-width: 520px;
      width: 100%;
      padding: 18px 20px;
      border-left: 4px solid var(--vscode-errorForeground, #f14c4c);
      background-color: var(--vscode-textBlockQuote-background, rgba(128, 128, 128, 0.12));
      border-radius: 4px;
    }

    .error-title {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--vscode-errorForeground, #f14c4c);
    }

    .error-message {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <script>
    window.mediaUri = "{{MEDIA_URI}}";
    window.wasmUri = "{{WASM_URI}}";
    window.workerUri = "{{WORKER_URI}}";
  </script>
  <script defer src="{{WEBVIEW_BUNDLE_URI}}"></script>
</head>

<body>
  <main id="app">
    <div id="loading" class="status-overlay" role="status" aria-live="polite">
      <div class="loading-box">
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading PDF…</span>
      </div>
    </div>
    <div id="error" class="status-overlay" role="alert" hidden>
      <div class="error-card">
        <h2 class="error-title">Failed to load PDF</h2>
        <p id="error-text" class="error-message"></p>
      </div>
    </div>
    <div id="viewer-host"></div>
  </main>
</body>

</html>
